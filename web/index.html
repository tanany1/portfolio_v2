<!DOCTYPE html>
<html>
    <head>
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
        <meta name="description" content="Ahmed Mohamed Ali - Flutter & Cross-Platform Mobile Engineer Portfolio" />

        <!-- iOS meta tags & icons -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Ahmed Mohamed Ali" />
        <link rel="apple-touch-icon" href="icons/Icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="favicon.png" />

        <title>Ahmed Mohamed Ali</title>
        <link rel="manifest" href="manifest.json" />

        <script>
            // If accidentally accessed via /web/ or /web/index.html on GitHub Pages, redirect to root
            if (window.location.pathname.includes('/web/')) {
                window.location.replace(window.location.pathname.replace(/\/web\/?(index\.html)?$/, '/') + window.location.search + window.location.hash);
            }
        </script>

        <style>
            body {
                margin: 0;
                background-color: #0B0F19;
            }
            .container {
                margin: 0;
                position: absolute;
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #0B0F19;
            }
            .loader {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                border: 4px solid rgba(0, 210, 255, 0.15);
                border-top-color: #00D2FF;
                animation: spin 0.8s linear infinite;
                box-shadow: 0 0 24px rgba(0, 210, 255, 0.18);
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="loader"></div>
        </div>
        <script src="flutter_bootstrap.js" async></script>
        <script>
            window.addEventListener('flutter-first-frame', function () {
                var el = document.getElementsByClassName('container')[0];
                if (el) el.remove();
            });
        </script>
    </body>
</html>
